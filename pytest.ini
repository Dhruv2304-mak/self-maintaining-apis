[pytest]
minversion = 9.0
testpaths = tests
pythonpath = .
xfail_strict = true

addopts =
    --strict-markers
    --strict-config
    --disable-socket
    -ra

markers =
    unit: fast, isolated tests of a single module
    integration: multiple internal modules composed, all external boundaries faked
    meta: tests that verify the test harness itself
    slow: takes longer than one second
    network_forbidden: documentary marker; the socket block does the actual enforcement

; pytest-socket 0.8.0 calls warnings.warn() inside SocketBlockedError.__init__
; and SocketConnectBlockedError.__init__, before super().__init__(). Under
; `error` that warning raises first, so a blocked socket surfaces as UserWarning
; and the blocked-socket error is never constructed. Downgrading just this
; message keeps the block itself intact -- the error still propagates and still
; fails the test -- while letting tests assert on SocketBlockedError by name.
; Comments live above the key rather than between entries: iniconfig strips
; mid-continuation comment lines, but relying on that is a fragile corner.
filterwarnings =
    error
    default:A test tried to use socket:UserWarning
